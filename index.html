<script>/* 24-item collocation feedback study. Plain browser JavaScript; no UI frameworks/CDNs.
   For each item: first-letter-cued gap fill -> submit -> immediate individualized feedback (10 s) -> feedback hidden -> next button.
   Then 120 s arithmetic distractor -> 24-item no-cue recall.
   All gap-fill responses untimed. 24 CSV rows per completed run.
   The CSV contains raw responses and preliminary exact matches, NOT final scored errors.
   It does not record declined consent, in accordance with the consent/withdrawal design.
*/
(function () {
  'use strict';
  const C = window.STUDY_CONFIG;
  const N = 24, FEEDBACK_MS = 10000, MATH_MS = 120000;
  const STORE = 'l2-collocation-24-bilingual-v4';
  // 数据只自动记录，不预先宣称非目标词都是错误。
  // 本实验初始错误是否可用于主要分析，须在导出后人工核查。
  const HEADERS = [
    'participant_id','session_id','version',
    'consent_agreed','age18_confirmed','consent_timestamp',
    'experiment_started_at','experiment_finished_at','completed',
    'total_seconds','off_tab_seconds','math_attempts','math_correct',
    'item_id','condition','target_verb','initial_order','initial_response',
    'posttest_order','posttest_response','feedback_visible_ms',
    'initial_exact_match','post_exact_match','initial_response_repeated'
  ];
  const app = document.getElementById('app');
  const bank = ITEM_BANK.map(x => Object.freeze({...x}));
  if (bank.length !== N || new Set(bank.map(x => x.id)).size !== N) {
    app.textContent = '材料配置错误：需要24个互不重复的项目。'; return;
  }
  const params = new URLSearchParams(location.search);
  const suppliedPid = (params.get('pid') || '').trim().toUpperCase();
  const configId = String(C.dataPipeExperimentId || '').trim();
  const online = !!configId;
  const demoOnly = !online;

  const ec = text => String(text == null ? '' : text).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const normal = t => String(t ?? '').normalize('NFKC').trim();
  const pidValid = s => /^[A-Z0-9-]{3,20}$/.test(s);
  function newRunId() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
      const b = new Uint8Array(16); crypto.getRandomValues(b);
      return Array.from(b, x=>x.toString(16).padStart(2,'0')).join('');
    }
    return 'S'+Date.now()+'-'+Math.floor(Math.random()*1e9);
  }
  function hash(s) {let v=2166136261;for(const ch of s){v=Math.imul(v^ch.charCodeAt(0),16777619)}return v>>>0}
  function shuffle(values, seed) {
    const o = [...values]; let v = hash(seed);
    for(let i=o.length-1;i>0;i--){v=(Math.imul(v,1664525)+1013904223)>>>0;
      const j=Math.floor(v/4294967296*(i+1));[o[i],o[j]]=[o[j],o[i]];}
    return o;
  }
  const byId = Object.fromEntries(bank.map(x=>[x.id,x]));
  function versionFor(pid) {const match=/^P(\d{2,6})$/.exec(pid);
    return match ? ((Number(match[1])-1+40000)%4+1) : hash(pid)%4+1; }
  function conditionFor(id,version) {
    const ix = bank.findIndex(x=>x.id===id);
    return (ix%2===0) === (version%2===1) ? 'A':'B';
  }
  // V1/V3 and V2/V4 assign each item to opposite feedback conditions.
  // Items are intermixed in a participant-specific order; no feedback blocks.
  let s;
  try { const saved=sessionStorage.getItem(STORE); if(saved){const x=JSON.parse(saved);
    if(x && x.session_id && x.stage && (!suppliedPid || x.participant_id === suppliedPid)) s=x;}
  } catch(e) { /* disabled storage: proceed without resume */ }
  if(!s) s={stage:'consent',participant_id:'',session_id:newRunId(),version:0,
    consent_timestamp:'',language:'zh',start_ms:0,end_ms:0,initial:{},post:{},
    initialOrder:[],postOrder:[],feedbackSeen:{},feedbackMs:{},index:0,
    feedbackDeadline:0,feedbackRemainingMs:0,
    mathDeadline:0,mathRemainingMs:MATH_MS,mathQuestion:0,mathAnswers:0,mathCorrect:0,
    offTabMs:0,hiddenSinceMs:0,uploadConfirmed:false,uploadMessage:''};
  // Refresh/reload should not discard an unfinished study. If an old partially
  // saved state is incomplete, initialize the new diagnostics without rewriting answers.
  if(!s.feedbackMs) s.feedbackMs={};
  if(!s.language || !['zh','en'].includes(s.language)) s.language='zh';
  if(!Number.isFinite(s.mathCorrect)) s.mathCorrect=0;
  if(!Number.isFinite(s.offTabMs)) s.offTabMs=0;
  if(!Number.isFinite(s.hiddenSinceMs)) s.hiddenSinceMs=0;
  if(!Number.isFinite(s.mathRemainingMs)) s.mathRemainingMs=MATH_MS;
  let timer=null, inFlight=false, feedbackVisibilityHandler=null, mathVisibilityHandler=null;
  // The entire experiment duration is a wall-clock interval from acceptance to
  // the last test response. Off-tab time is logged separately for QC.
  document.addEventListener('visibilitychange', () => {
    if(!s.start_ms || s.end_ms) return;
    if(document.hidden){
      if(!s.hiddenSinceMs) s.hiddenSinceMs=Date.now();
    }else if(s.hiddenSinceMs){
      s.offTabMs += Math.max(0,Date.now()-s.hiddenSinceMs);
      s.hiddenSinceMs=0;
    }
    persist();
  });
  function persist(){try{sessionStorage.setItem(STORE,JSON.stringify(s))}catch(e){}}
  function stopTimer(){
    if(timer!==null)clearTimeout(timer); timer=null;
    if(feedbackVisibilityHandler){document.removeEventListener('visibilitychange',feedbackVisibilityHandler);feedbackVisibilityHandler=null;}
    if(mathVisibilityHandler){document.removeEventListener('visibilitychange',mathVisibilityHandler);mathVisibilityHandler=null;}
  }
  function setContent(content){stopTimer();app.innerHTML=content;}
  function addBtn(label,click,extra){const b=document.createElement('button');b.type='button';
    b.textContent=label;if(extra)b.className=extra; b.onclick=click;app.appendChild(b);return b;}
  function L(zh,en){return s.language==='en'?en:zh;}
  function mount(html){
    const isConsent=html.includes('class="consent"');
    const nav=isConsent?'':`<nav class="lang-switch" aria-label="Language / 语言">
      <button type="button" id="page-switch-zh" aria-pressed="${s.language==='zh'}">中文</button>
      <button type="button" id="page-switch-en" aria-pressed="${s.language==='en'}">English</button>
    </nav>`;
    setContent('<main>'+nav+html+'</main>');
    document.documentElement.lang=s.language==='en'?'en':'zh-CN';
    const root=app.querySelector('main');
    if(!isConsent){
      for(const code of ['zh','en']) {
        const btn=root.querySelector('#page-switch-'+code);
        if(btn) btn.onclick=()=>{
          if(code===s.language)return;
          const current=root.querySelector('input.answer');
          // Keep any typed response when the language is switched mid-question.
          if(current && s.stage==='initial'||current && s.stage==='post'||current && s.stage==='practice')
            s.draftAnswer={stage:s.stage,index:s.index,value:current.value};
          s.language=code;persist();render();
        };
      }
    }
    return root;
  }
  function paragraph(title,body){return `<h1>${title}</h1>${body}`;}
  function nextStage(stage){s.stage=stage;s.index=0;s.draftAnswer=null;persist();render();}
  function completeError(msg){mount(`<h1>${L('实验数据核对失败','Data validation error')}</h1><p>${ec(msg)}</p><p>${L('请勿继续提交。请联系研究者。','Please do not submit again. Contact the researcher.')}</p>`);}
  function consent(){
    const root=mount(`<section class="consent">
      <nav class="lang-switch" aria-label="语言 / Language">
        <button type="button" id="switch-zh" aria-pressed="true">中文</button>
        <button type="button" id="switch-en" aria-pressed="false">English</button>
      </nav>
      <div id="consent-zh" class="lang-view" lang="zh-CN">
        <h1>二语习得研究参与者说明及知情同意书</h1>
        <p>尊敬的参与者：</p>
        <p>您好！欢迎参加本次关于二语习得与英语搭配学习的研究！</p>
        <p>本研究旨在探究不同纠正性反馈方式对英语动宾搭配学习的影响。实验共包含三个部分：</p>
        <p><strong>第一部分：英文填空与学习反馈。</strong>根据句子语境填写适当的英文动词，每题作答后阅读正确表达。</p>
        <p><strong>第二部分：数学判断。</strong>完成一项简短的数学判断任务。</p>
        <p><strong>第三部分：英文填空测试。</strong>再次完成英文填空任务。</p>
        <p>实验预计需要约30分钟，具体时长因人而异。请在安静的环境中使用电脑独立完成，期间请勿使用词典、翻译软件或其他语言辅助工具。</p>
        <p><strong>自愿参与与退出：</strong>您的参与完全自愿，可在实验过程中随时退出，无需说明理由，也不会影响您的学业成绩或与学校、教师的关系。</p>
        <p><strong>风险与收益：</strong>本研究预计不会带来明显风险，但实验过程可能造成轻微疲劳。参与者不一定获得直接收益，但研究结果可能为英语学习及反馈设计提供参考。</p>
        <p><strong>数据保密：</strong>实验将使用参与者编号记录作答数据。数据仅用于学术研究，并按照相关研究伦理与数据保护要求安全保存和处理。研究报告不会披露可直接识别个人身份的信息。</p>
        <p>如有任何疑问或顾虑，欢迎通过以下方式联系我们。感谢您的参与和支持！</p>
        <p>研究者：杜安琪<br>邮箱：<a href="mailto:hvyad1@nottingham.edu.cn">hvyad1@nottingham.edu.cn</a></p>
        <p>指导教师：Dr. Stewart Gray<br>邮箱：<a href="mailto:stewart.gray@nottingham.edu.cn">stewart.gray@nottingham.edu.cn</a></p>
        <p>宁波诺丁汉大学</p>
      </div>
      <div id="consent-en" class="lang-view" lang="en" hidden>
        <h1>Participant Information and Informed Consent</h1>
        <p>Dear Participant,</p>
        <p>You are invited to participate in a study on second language acquisition and English collocation learning.</p>
        <p>This study investigates how different corrective feedback formats affect the learning of English verb–noun collocations. The experiment consists of three parts:</p>
        <p><strong>Part 1: English Gap-Filling and Feedback.</strong> Complete English sentences by supplying appropriate verbs and review the correct expression after each response.</p>
        <p><strong>Part 2: Arithmetic Judgement.</strong> Complete a brief arithmetic judgement task.</p>
        <p><strong>Part 3: English Recall Test.</strong> Complete another English gap-filling test.</p>
        <p>The experiment will take approximately 30 minutes, depending on your pace. Please complete it independently on a computer in a quiet environment without using dictionaries, translation software, or other language-learning tools.</p>
        <p><strong>Voluntary Participation and Withdrawal:</strong> Participation is entirely voluntary. You may withdraw at any time during the experiment without giving a reason or affecting your academic grades or relationships with the university or teaching staff.</p>
        <p><strong>Risks and Benefits:</strong> No significant risks are anticipated, although you may experience mild fatigue. There is no guaranteed direct benefit, but the findings may contribute to English learning and feedback design.</p>
        <p><strong>Confidentiality:</strong> Responses will be recorded using participant codes and used solely for academic research. Data will be stored and handled securely in accordance with applicable research ethics and data protection requirements. No directly identifying information will be disclosed in research reports.</p>
        <p>If you have any questions or concerns, please contact us. Thank you for your participation!</p>
        <p>Researcher: Anqi DU<br>Email: <a href="mailto:hvyad1@nottingham.edu.cn">hvyad1@nottingham.edu.cn</a></p>
        <p>Supervisor: Dr. Stewart Gray<br>Email: <a href="mailto:stewart.gray@nottingham.edu.cn">stewart.gray@nottingham.edu.cn</a></p>
        <p>University of Nottingham Ningbo China</p>
      </div>
      <div id="consent-controls">
        <h2><span class="lang-label" data-lang="zh">知情同意</span><span class="lang-label" data-lang="en" hidden>Consent</span></h2>
        <label class="check"><input id="adult" type="checkbox"><span class="lang-label" data-lang="zh">我确认自己已年满18周岁。</span><span class="lang-label" data-lang="en" hidden>I confirm that I am aged 18 or above.</span></label>
        <label class="check"><input id="read" type="checkbox"><span class="lang-label" data-lang="zh">我已阅读并理解上述研究说明。</span><span class="lang-label" data-lang="en" hidden>I have read and understood the information above.</span></label>
        <p><span class="lang-label" data-lang="zh">我了解参与是自愿的，并决定：</span><span class="lang-label" data-lang="en" hidden>I understand participation is voluntary and choose:</span></p>
        <label class="check"><input type="radio" name="consent-choice" value="yes"><span class="lang-label" data-lang="zh">我同意参加</span><span class="lang-label" data-lang="en" hidden>I agree to participate</span></label>
        <label class="check"><input type="radio" name="consent-choice" value="no"><span class="lang-label" data-lang="zh">我不同意</span><span class="lang-label" data-lang="en" hidden>I do not agree</span></label>
        <label class="block"><span class="lang-label" data-lang="zh">参与者编号</span><span class="lang-label" data-lang="en" hidden>Participant ID</span>
          <input id="pid" class="code" type="text" maxlength="20" autocomplete="off" value="${ec(s.participant_id || suppliedPid)}" ${suppliedPid?'readonly':''} placeholder="P001"></label>
        <p id="consent-error" class="small" role="alert"></p>
      </div>
    </section>`);
    let language = s.language;
    function setConsentLanguage(value){
      language=value;s.language=value;persist();document.documentElement.lang=value==='en'?'en':'zh-CN';
      root.querySelector('#consent-zh').hidden=value!=='zh';
      root.querySelector('#consent-en').hidden=value!=='en';
      root.querySelector('#switch-zh').setAttribute('aria-pressed',String(value==='zh'));
      root.querySelector('#switch-en').setAttribute('aria-pressed',String(value==='en'));
      root.querySelectorAll('.lang-label').forEach(el=>el.hidden=el.dataset.lang!==value);
      confirmBtn.textContent=value==='zh'?'继续':'Continue';
      root.querySelector('#consent-error').textContent='';
    }
    const confirmBtn=document.createElement('button');root.appendChild(confirmBtn);
    root.querySelector('#switch-zh').onclick=()=>setConsentLanguage('zh');
    root.querySelector('#switch-en').onclick=()=>setConsentLanguage('en');
    setConsentLanguage(s.language);
    confirmBtn.onclick=()=>{
      const choice=root.querySelector('input[name="consent-choice"]:checked');
      const err=root.querySelector('#consent-error');
      if(!choice){err.textContent=language==='zh'?'请选择是否同意参加。':'Please select whether you agree to participate.';return}
      if(choice.value==='no'){
        try{sessionStorage.removeItem(STORE)}catch(e){}
        mount(`<h1>${L('感谢您阅读研究说明','Thank you for reviewing the study information')}</h1><p>${L('您选择不参加本研究，可以直接关闭页面。不会保存实验作答数据。','You have declined to participate and may close this page. No experiment responses will be recorded.')}</p>`);
        return;
      }
      if(!root.querySelector('#adult').checked||!root.querySelector('#read').checked){
        err.textContent=language==='zh'?'请先确认年满18周岁，并已阅读研究说明。':'Please confirm you are at least 18 and have read the information.';return;

  function equation(index){
    let seed=hash(s.participant_id+'-math-'+index);
    function r(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
    const x=30+Math.floor(r()*50), y=10+Math.floor(r()*20);
    const minus=r()<.5, answer=minus?x-y:x+y;
    const valid=index%2===0, offset=(Math.floor(r()*5)+1)*(r()<.5?-1:1);
    return {text:`${x} ${minus?'-':'+'} ${y} = ${answer+(valid?0:offset)}`,correct:valid};
  }
  function math(){
    const remaining=Number.isFinite(s.mathRemainingMs)?s.mathRemainingMs:MATH_MS;
    if(remaining<=0){s.mathRemainingMs=0;s.mathDeadline=0;nextStage('postInstructions');return;}
    // Pause the 120-second distractor clock while the tab is hidden, just as we
    // pause the 10-second feedback interval.
    if(!document.hidden){
      if(!s.mathDeadline) s.mathDeadline=Date.now()+remaining;
      s.mathRemainingMs=Math.max(0,s.mathDeadline-Date.now());
    }
    const question=equation(s.mathQuestion);
    const root=mount(`<h1>${L('第二部分：数学判断任务','Part 2: Arithmetic Judgement')}</h1>`);

    const answers=document.createElement('div');answers.className='center';root.appendChild(answers);

      if(s.stage!=='math' || document.hidden) return;
      if(s.mathDeadline && Date.now()>=s.mathDeadline){finishMath();return;}
      s.mathQuestion++;s.mathAnswers++;

    for(const value of [{label:L('正确','True'),answer:true},{label:L('错误','False'),answer:false}]){

      s.mathDeadline=Date.now()+s.mathRemainingMs;
      timer=setTimeout(finishMath,s.mathRemainingMs);
      persist();

    mathVisibilityHandler=()=>{
      if(document.hidden){

  function checkData(){

  function normalizedForMatching(value){
    return normal(value).toLocaleLowerCase('en-US').replace(/\s+/g,' ');
  }
  function cells(){
    if(!s.end_ms)s.end_ms=Date.now();
    const total=Math.max(0,Math.round((s.end_ms-s.start_ms)/1000));
    const offTabMs=(s.offTabMs||0)+(s.hiddenSinceMs?Math.max(0,s.end_ms-s.hiddenSinceMs):0);
    const offTab=Math.max(0,Math.round(offTabMs/1000));
    const startISO=new Date(s.start_ms).toISOString();
    const endISO=new Date(s.end_ms).toISOString();
    return bank.map(it=>{
      const initial=s.initial[it.id]??'',post=s.post[it.id]??'';
      const ini=normalizedForMatching(initial), last=normalizedForMatching(post);
      const target=normalizedForMatching(it.target);
      const full=normalizedForMatching(it.collocation);
      const matchTarget=x=>Number(x!=='' && (x===target||x===full));
      return [
        s.participant_id,s.session_id,'V'+s.version,
        1,1,s.consent_timestamp,startISO,endISO,1,
        total,offTab,s.mathAnswers,s.mathCorrect,
        it.id,conditionFor(it.id,s.version),it.target,
        s.initialOrder.indexOf(it.id)+1,initial,
        s.postOrder.indexOf(it.id)+1,post,s.feedbackMs[it.id]??'',

        Number(ini!=='' && ini===last)

    });

  function csvData(){return [HEADERS,...cells()].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')+'\r\n'}

  function configComplete(){return Boolean(configId) && /^[a-zA-Z0-9_-]+$/.test(configId);}
  async function upload(){

    if(!configComplete()){s.uploadMessage=L('DataPipe 实验编号未正确填写，无法上传。','DataPipe Experiment ID is invalid.');persist();return;}
    inFlight=true;s.uploadMessage='UPLOAD_IN_PROGRESS';persist();render();

      const controller=new AbortController();const t=setTimeout(()=>controller.abort(),25000);
      let response;try{
        response=await fetch('https://pipe.jspsych.org/api/data/',{
          method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({experimentID:configId,filename:filename(),data:csvData()}),signal:controller.signal});
      }finally{clearTimeout(t)}
      let detail={};try{detail=await response.json()}catch(e){}
      if(response.status===201||response.status===202){s.uploadConfirmed=true;

      else {s.uploadMessage=`UPLOAD_FAILED_HTTP_${response.status}: ${detail.error||'unknown'}`;}

  function uploadStatus(){

  function render(){try{

    if(s.stage==='itemFeedback')return itemFeedback();
    if(s.stage==='feedbackWait')return feedbackWait();
    if(s.stage==='mathInstructions')return mathInstructions();
    if(s.stage==='math')return math();
    if(s.stage==='postInstructions')return postInstructions();
    if(s.stage==='end')return end();
    throw Error('Unknown stage');
  }catch(e){console.error(e);completeError('程序运行错误：'+e.message)}}
  // Expose read-only testing diagnostics; not used by participants.
  window.__studyCheck = () => ({stage:s.stage,participant_id:s.participant_id,version:s.version,
    item_count:N,initial_count:Object.keys(s.initial).length,feedback_count:Object.keys(s.feedbackSeen).length,post_count:Object.keys(s.post).length,
    math_attempts:s.mathAnswers,math_correct:s.mathCorrect,total_seconds:s.end_ms?Math.round((s.end_ms-s.start_ms)/1000):null,
    feedback_A:bank.filter(it=>conditionFor(it.id,s.version)==='A').length,
    feedback_B:bank.filter(it=>conditionFor(it.id,s.version)==='B').length});
  render();
}());
</script>
